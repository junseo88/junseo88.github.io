# Photo gallery shown on /photos/ (rendered by _pages/photos.md).
#
# To add a photo:
#   1. Put the original JPEG in assets/img/photos/ (do not resize or re-compress it;
#      the build generates the smaller WebP thumbnails automatically).
#   2. Add an entry below. Order here = order on the page.
#      width / height are the pixel size of the file (`identify file.jpg` prints them).
#      caption appears in the full-screen viewer; leave it empty to show none.

