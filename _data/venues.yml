# Official venue names for the publication cards (_layouts/bib.liquid). Keys are the bib `abbr` without its
# year ("NeurIPS 2026" -> "NeurIPS"). A card prints the official name, then the abbreviation in bold:
#   Advances in Neural Information Processing Systems (NeurIPS), 2026
# When the official name already contains the abbreviation ("ACS Photonics", "arXiv preprint"), that part is
# bolded in place instead. A venue missing here falls back to the entry's booktitle / journal.
"NeurIPS":
  name: "Advances in Neural Information Processing Systems"
"ICML":
  name: "International Conference on Machine Learning"
"ICLR":
  name: "International Conference on Learning Representations"
"CVPR":
  name: "IEEE/CVF Conference on Computer Vision and Pattern Recognition"
"ICCV":
  name: "IEEE/CVF International Conference on Computer Vision"
"ECCV":
  name: "European Conference on Computer Vision"
"AAAI":
  name: "AAAI Conference on Artificial Intelligence"
"arXiv":
  name: "arXiv preprint"
"ACS Photonics":
  name: "ACS Photonics"
"Nano Letters":
  name: "Nano Letters"
"Science Advances":
  name: "Science Advances"
